# cargo-deny configuration for pacto-bot-api.
# Run: cargo deny check

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-apple-darwin" },
]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
ignore = [
    # libcrux-sha3 0.0.8 / libcrux-secrets 0.0.5 are pinned transitively via
    # mdk-core 0.8.0 -> openmls_rust_crypto 0.5.1 -> hpke-rs 0.6.1, which
    # requires these exact versions (no semver-compatible fix is available;
    # `cargo update -p libcrux-sha3 -p libcrux-secrets` resolves nothing).
    # Bumping past them requires an upstream hpke-rs/openmls_rust_crypto
    # release, which is outside this daemon's dependency ownership. Revisit
    # on the next mdk-core bump (tracked by KTD7 / pacto-bot-api-ah6x).
    "RUSTSEC-2026-0207", # libcrux-sha3 incremental SHAKE squeeze output
    "RUSTSEC-2026-0208", # libcrux-sha3 AVX2 SHAKE-256 panic
    "RUSTSEC-2026-0212", # libcrux-secrets aarch64 constant-time swap/select

    # nostr-relay-pool 0.44.3 is flagged unmaintained (informational, not a
    # vulnerability): its functionality was folded into nostr-sdk starting
    # with 0.45.0, and upstream wants users to migrate there. We reach it
    # transitively through nostr-sdk 0.44.1 and nostr-connect 0.44.1, plus a
    # direct dependency, and `cargo update -p nostr-relay-pool` resolves
    # nothing (no semver-compatible fix exists on the 0.44.x line). We can't
    # move off it without bumping the whole nostr-sdk line to >=0.45.0, and
    # that's out of scope here: pacto-app pins nostr-sdk 0.44.1, and
    # pacto-bot-api must stay wire-compatible with that pin. Revisit once
    # pacto-app moves to nostr-sdk 0.45.0 and this daemon can follow.
    "RUSTSEC-2026-0243", # nostr-relay-pool is unmaintained
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "CC0-1.0",
    "Zlib",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "OpenSSL",
    "CDLA-Permissive-2.0",
    "MIT-0",
]
confidence-threshold = 0.8
exceptions = []

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

[bans]
# Multiple versions are common in the Rust ecosystem for transitive deps;
# warn only so the report is readable but does not fail CI.
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-git = ["https://github.com/marmot-protocol/mdk"]
