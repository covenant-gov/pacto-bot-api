name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default. Jobs that publish escalate explicitly.
permissions:
  contents: read

jobs:
  contract-artifact:
    name: Build contract artifact
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Extract contract version
        id: version
        run: |
          version=$(python3 -c "import json; print(json.load(open('schemas/jsonrpc.json'))['info']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build contract artifact and checksum
        run: |
          version="${{ steps.version.outputs.version }}"
          cp schemas/jsonrpc.json "pacto-contract-${version}.json"
          sha256sum "pacto-contract-${version}.json" > "pacto-contract-${version}.json.sha256"

      - name: Upload contract artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pacto-contract
          path: |
            pacto-contract-*.json
            pacto-contract-*.json.sha256
          if-no-files-found: error

  # Windows (x86_64-pc-windows-gnu) and FreeBSD (x86_64-unknown-freebsd) are
  # deliberately absent from this matrix: rusqlite#1025 blocks the Windows
  # SQLCipher/crypto link, and cargo-zigbuild#356 blocks FreeBSD `kvm` symbol
  # resolution. Windows still gets a compile-only `cargo check` gate in
  # ci.yml so its code paths stay compiled; FreeBSD has no CI gate.
  build:
    name: Build ${{ matrix.target }}
    runs-on: macos-latest
    needs: contract-artifact
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            asset: darwin_amd64
          - target: aarch64-apple-darwin
            asset: darwin_arm64
          - target: x86_64-unknown-linux-musl
            asset: linux_amd64
          - target: aarch64-unknown-linux-musl
            asset: linux_arm64

    steps:
      - name: Set short SHA
        id: vars
        run: echo "sha_short=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406 # v2.2.1
        with:
          version: 0.16.0

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --version 0.23.0 --locked

      - name: Download contract artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pacto-contract
          path: dist
          if-no-files-found: error

      - name: Verify artifact matches in-repo snapshot
        run: |
          version="${{ needs.contract-artifact.outputs.version }}"
          diff -q "dist/pacto-contract-${version}.json" schemas/jsonrpc.json

      - name: Build release binary
        env:
          GIT_COMMIT_SHORT: ${{ steps.vars.outputs.sha_short }}
        run: cargo zigbuild --release --target ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pacto-bot-api-${{ matrix.target }}
          path: target/${{ matrix.target }}
          retention-days: 30
          if-no-files-found: error

  # Build the Python SDK without the pypi environment / publishing secret.
  # Publishing happens in pypi-publish so install/build never sees PYPI_API_TOKEN.
  pypi-build:
    name: Build Python SDK package
    runs-on: ubuntu-latest
    needs: contract-artifact
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"

      - name: Download contract artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pacto-contract
          path: dist
          if-no-files-found: error

      - name: Generate Python SDK from contract artifact
        run: |
          version="${{ needs.contract-artifact.outputs.version }}"
          python python/scripts/generate.py \
            --contract-source "dist/pacto-contract-${version}.json"

      - name: Install build tools
        run: python -m pip install --upgrade pip build

      - name: Build Python SDK
        run: python -m build python/

      - name: Upload Python distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-sdk-dist
          path: python/dist/
          if-no-files-found: error

  # Retains long-lived PYPI_API_TOKEN via the existing `pypi` environment until
  # a maintainer configures PyPI Trusted Publishing (OIDC) externally.
  # Do not switch this job to OIDC/`id-token: write` until that setup is verified.
  # See docs/ci-supply-chain.md.
  pypi-publish:
    name: Publish Python SDK to PyPI
    runs-on: ubuntu-latest
    needs: pypi-build
    continue-on-error: true
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions: {}
    environment:
      name: pypi
      url: https://pypi.org/p/pacto-bot-sdk
    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-sdk-dist
          path: python/dist
          if-no-files-found: error

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: python/dist/

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: [contract-artifact, build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Download contract artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pacto-contract
          path: dist
          if-no-files-found: error

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          pattern: pacto-bot-api-*

      - name: Reconstruct target layout
        run: |
          mkdir -p target
          for artifact_dir in artifacts/pacto-bot-api-*; do
            target_triple=$(basename "$artifact_dir" | sed 's/^pacto-bot-api-//')
            mv "$artifact_dir" "target/$target_triple"
          done

      - name: Package artifacts
        run: ./scripts/package-release.sh "${GITHUB_REF_NAME#v}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
          generate_release_notes: true

  docker-image:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: [contract-artifact, build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Set short SHA
        id: vars
        run: echo "sha_short=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            GIT_COMMIT_SHORT=${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
