name: Prep Release

# Manually-triggered wrapper around scripts/prep-release.sh. Runs the full
# version bump + regen + validate + test gate on a clean checkout, then opens
# a PR with the diff for review instead of pushing straight to the base
# branch. Tagging/publishing still happens by hand after merge (see
# release.yml, which triggers on `v*` tags).

on:
  workflow_dispatch:
    inputs:
      daemon_version:
        description: 'New daemon version (e.g. 0.11.0)'
        required: true
        type: string
      sdk_version:
        description: 'Python SDK version override (default: next minor of current SDK version)'
        required: false
        type: string
      contract_version:
        description: 'JSON-RPC contract version override (default: daemon version)'
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: prep-release-${{ inputs.daemon_version }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  prep-release:
    name: Prepare release ${{ inputs.daemon_version }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: prep-release

      - name: Install cargo-generate
        run: cargo install cargo-generate --version 0.23.12

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run scripts/prep-release.sh
        env:
          DAEMON_VERSION: ${{ inputs.daemon_version }}
          SDK_VERSION: ${{ inputs.sdk_version }}
          CONTRACT_VERSION: ${{ inputs.contract_version }}
        run: |
          args=("$DAEMON_VERSION")
          if [[ -n "$SDK_VERSION" ]]; then
            args+=(--sdk-version "$SDK_VERSION")
          fi
          if [[ -n "$CONTRACT_VERSION" ]]; then
            args+=(--contract-version "$CONTRACT_VERSION")
          fi
          ./scripts/prep-release.sh "${args[@]}"

      - name: Open release-prep pull request
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: release ${{ inputs.daemon_version }}"
          title: "chore: release ${{ inputs.daemon_version }}"
          body: |
            Automated release prep for `${{ inputs.daemon_version }}`, generated by the
            **Prep Release** workflow (`scripts/prep-release.sh`).

            Review the diff (versions, `CHANGELOG.md`, regenerated code/docs), then
            after merging:

            ```
            git tag v${{ inputs.daemon_version }}
            git push origin v${{ inputs.daemon_version }}
            ```

            Pushing the tag triggers `release.yml` (build, package, GitHub release,
            PyPI publish, Docker image).
          branch: release-prep/v${{ inputs.daemon_version }}
          base: ${{ github.ref_name }}
          delete-branch: true
          labels: release

      - name: Summarize
        if: steps.cpr.outputs.pull-request-url
        run: |
          echo "Release prep PR: ${{ steps.cpr.outputs.pull-request-url }}" >> "$GITHUB_STEP_SUMMARY"
