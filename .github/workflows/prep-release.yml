name: Prep Release

# Manually-triggered wrapper around scripts/prep-release.sh. Runs the full
# version bump + regen + validate + test gate on a clean checkout, then opens
# a PR with the diff for review instead of pushing straight to the base
# branch. Tagging/publishing still happens by hand after merge (see
# release.yml, which triggers on `v*` tags).

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type, applied to the current Cargo.toml version. Pick "custom" to set an exact daemon_version below.'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - custom
        default: patch
      daemon_version:
        description: 'Exact daemon version (e.g. 0.11.0). Required only when version_bump is "custom"; ignored otherwise.'
        required: false
        type: string
      sdk_version:
        description: 'Python SDK version override (default: next minor of current SDK version)'
        required: false
        type: string
      contract_version:
        description: 'JSON-RPC contract version override (default: daemon version)'
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: prep-release-${{ github.ref }}
  cancel-in-progress: false

# Default deny; the job below escalates only what create-pull-request needs.
permissions: {}

jobs:
  prep-release:
    name: Prep release (${{ inputs.version_bump }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # create-pull-request configures git with the job token; do not
          # persist the default checkout credentials on disk.
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: prep-release

      - name: Install cargo-generate
        run: cargo install cargo-generate --version 0.23.12 --locked

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Resolve daemon version
        id: resolve
        env:
          BUMP: ${{ inputs.version_bump }}
          DAEMON_VERSION_INPUT: ${{ inputs.daemon_version }}
        run: |
          current=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['package']['version'])")
          if [[ "$BUMP" == "custom" ]]; then
            if [[ -z "$DAEMON_VERSION_INPUT" ]]; then
              echo "::error::version_bump=custom requires daemon_version to be set"
              exit 1
            fi
            resolved="$DAEMON_VERSION_INPUT"
          else
            IFS='.' read -r major minor patch <<< "${current%%-*}"
            case "$BUMP" in
              major) resolved="$((major + 1)).0.0" ;;
              minor) resolved="${major}.$((minor + 1)).0" ;;
              patch) resolved="${major}.${minor}.$((patch + 1))" ;;
              *) echo "::error::unknown version_bump '$BUMP'"; exit 1 ;;
            esac
          fi
          echo "Current daemon version: $current"
          echo "Resolved daemon version: $resolved"
          echo "daemon_version=$resolved" >> "$GITHUB_OUTPUT"

      - name: Run scripts/prep-release.sh
        env:
          DAEMON_VERSION: ${{ steps.resolve.outputs.daemon_version }}
          SDK_VERSION: ${{ inputs.sdk_version }}
          CONTRACT_VERSION: ${{ inputs.contract_version }}
        run: |
          args=("$DAEMON_VERSION")
          if [[ -n "$SDK_VERSION" ]]; then
            args+=(--sdk-version "$SDK_VERSION")
          fi
          if [[ -n "$CONTRACT_VERSION" ]]; then
            args+=(--contract-version "$CONTRACT_VERSION")
          fi
          ./scripts/prep-release.sh "${args[@]}"

      - name: Open release-prep pull request
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "chore: release ${{ steps.resolve.outputs.daemon_version }}"
          title: "chore: release ${{ steps.resolve.outputs.daemon_version }}"
          body: |
            Automated release prep for `${{ steps.resolve.outputs.daemon_version }}`
            (`${{ inputs.version_bump }}` bump), generated by the **Prep Release**
            workflow (`scripts/prep-release.sh`).

            Review the diff (versions, `CHANGELOG.md`, regenerated code/docs), then
            after merging:

            ```
            git tag v${{ steps.resolve.outputs.daemon_version }}
            git push origin v${{ steps.resolve.outputs.daemon_version }}
            ```

            Pushing the tag triggers [`release.yml`](https://github.com/covenant-gov/pacto-bot-api/blob/main/.github/workflows/release.yml) (build, package, GitHub release,
            PyPI publish, Docker image).
          branch: release-prep/v${{ steps.resolve.outputs.daemon_version }}
          base: ${{ github.ref_name }}
          delete-branch: true
          labels: release

      - name: Summarize
        if: steps.cpr.outputs.pull-request-url
        run: |
          echo "Release prep PR: ${{ steps.cpr.outputs.pull-request-url }}" >> "$GITHUB_STEP_SUMMARY"
